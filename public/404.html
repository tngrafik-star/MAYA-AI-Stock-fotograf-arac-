<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı | MayaListing</title>
<link rel="icon" href="/favicon.ico">
<style>
:root { --bg: #FBFBFD; --fg: #1D1D1F; --muted: #6E6E73; --accent: #FF9500; --line: rgba(0,0,0,0.12); }
@media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #f4f4f5; --muted: #a1a1aa; --accent: #f97316; --line: rgba(255,255,255,0.15); color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 520px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.code { font-size: 14px; letter-spacing: 0.12em; color: var(--accent); font-weight: 700; }
h1 { margin: 0; font-size: 28px; line-height: 1.25; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
a.btn { text-decoration: none; padding: 10px 18px; border-radius: 980px; border: 1px solid var(--line); color: var(--fg); font-weight: 600; font-size: 14px; }
a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.en { font-size: 14px; }
</style>
</head>
<body>
<main>
  <span class="code">404</span>
  <h1>Aradığınız sayfa bulunamadı</h1>
  <p>Bağlantı eskimiş ya da adres yanlış yazılmış olabilir.</p>
  <p class="en" lang="en">This page could not be found.</p>
  <div class="links">
    <a class="btn primary" href="/">Ana Sayfa</a>
    <a class="btn" href="/blog/">Blog</a>
    <a class="btn" href="/araclar/metadata-kontrol/">Metadata Kontrol Aracı</a>
  </div>
</main>
</body>
</html>
